publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^2.15.1
  cloud_firestore: ^4.7.1
  intl: ^0.19.0
  firebase_auth: ^4.17.0
  image_picker: ^1.0.7
  firebase_storage: ^11.6.5
